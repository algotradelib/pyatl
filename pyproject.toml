[build-system]
requires = [
    "scikit-build-core>=0.11",
    "nanobind>=2.9"
]
build-backend = "scikit_build_core.build"

[project]
name = "pyatl"
version = "0.0.0.9000"
description = "Python strategies on algotradelib's C++ replay"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pandas>=2.2"
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
# One wheel per platform for every Python from 3.12 (nanobind's stable ABI support).
wheel.py-api = "cp312"

[tool.scikit-build.cmake.define]
# CI: fetch algotradelib and its dependencies instead of finding an installed one (cmake/deps.cmake).
PYATL_FETCH_DEPS = {env = "PYATL_FETCH_DEPS", default = "OFF"}

[tool.pytest.ini_options]
testpaths = ["tests"]
