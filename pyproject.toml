[build-system]
requires = [
    "scikit-build-core>=0.11",
    "nanobind>=2.9"
]
build-backend = "scikit_build_core.build"

[project]
name = "pyatl"
version = "0.0.0.9000"
description = "Python strategies on algotradelib's C++ replay"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Young Geun Kim" }
]
keywords = [
    "backtesting",
    "algorithmic trading",
    "quantitative finance"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Office/Business :: Financial :: Investment"
]
dependencies = ["numpy>=1.26"]

[project.urls]
Homepage = "https://algotradelib.github.io/python/"
Source = "https://github.com/algotradelib/pyatl"
Issues = "https://github.com/algotradelib/pyatl/issues"
algotradelib = "https://github.com/algotradelib/algotradelib"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pandas>=2.2",
    "polars>=1.0"
]
doc = [
    "quartodoc>=0.11",
    # quartodoc 0.11 passes an option griffe 2 no longer takes.
    "griffe<2",
    "jupyter",
    "pandas>=2.2"
]
dev = [
    "pyatl[test,doc]"
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
# One wheel per platform for every Python from 3.12 (nanobind's stable ABI support).
wheel.py-api = "cp312"

[tool.scikit-build.cmake.define]
# CI: fetch algotradelib and its dependencies instead of finding an installed one (cmake/deps.cmake).
PYATL_FETCH_DEPS = {env = "PYATL_FETCH_DEPS", default = "OFF"}

[tool.pytest.ini_options]
testpaths = ["tests"]
