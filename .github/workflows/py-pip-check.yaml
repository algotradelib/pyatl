# Builds pyatl with pip against the installed algotradelib from GHCR and runs the tests, on every OS and Python.
# The daily run catches a library change that breaks pyatl: the package tag moves with the library's main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

name: py-pip-check

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14']

    name: ${{ matrix.os }} (${{ matrix.python-version }})

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: algotradelib/.github/actions/setup-atl@main

      - name: Library package revision
        shell: bash
        run: |
          case "$RUNNER_OS" in Linux) p=linux-x64 ;; macOS) p=macos-arm64 ;; Windows) p=windows-x64 ;; esac
          oras manifest fetch "ghcr.io/algotradelib/algotradelib:main-$p" |
            python -c "import json, sys; print('algotradelib revision:', json.load(sys.stdin).get('annotations', {}).get('org.opencontainers.image.revision'))"

      - name: OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "OPENSSL_ROOT_DIR=C:/Program Files/OpenSSL;C:/Program Files/OpenSSL/lib/VC/x64/MD" >> "$GITHUB_ENV"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements.txt
          pip install ".[test]" -v

      - name: Test
        run: python -m pytest

      # The extension must need nothing beyond the system's own libraries (macOS is checked by the tests).
      - name: Linked libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          so=$(python -c "import pyatl._core as c; print(c.__file__)")
          ldd "$so"
          # The first field of each line is the soname (or the loader's own path); only whole system names pass.
          system='^(linux-vdso\.so\.[0-9]+|(/usr)?(/lib(64)?/([a-z0-9_-]+/)?)?ld-linux[-a-z0-9_.]*\.so\.[0-9]+|lib(c|m|stdc\+\+|gcc_s|pthread|dl|rt)\.so\.[0-9]+)$'
          other=$(ldd "$so" | awk '{print $1}' | grep -E -v "$system" || true)
          if [ -n "$other" ]; then echo "::error::the extension links non-system libraries: $other"; exit 1; fi
