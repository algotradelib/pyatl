# Builds pyatl in a conda-forge environment (requirements/environment.yml) against the installed algotradelib.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: conda-check

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.14']

    name: ${{ matrix.os }} (${{ matrix.python-version }})

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v7

      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: pyatl-env
          environment-file: requirements/environment.yml
          python-version: ${{ matrix.python-version }}
          auto-activate-base: false

      - uses: algotradelib/.github/actions/setup-atl@main

      # OpenSSL comes from the environment; the library's CMake package asks for it at configure time.
      - name: OpenSSL from the environment
        run: |
          if [ "$RUNNER_OS" = Windows ]; then root="$CONDA_PREFIX/Library"; else root="$CONDA_PREFIX"; fi
          echo "OPENSSL_ROOT_DIR=$root" >> "$GITHUB_ENV"

      - name: Environment
        run: conda list

      - name: Install
        run: pip install . -v --no-build-isolation

      - name: Test
        run: python -m pytest
