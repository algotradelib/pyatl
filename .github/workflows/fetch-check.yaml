# The fetch route (PYATL_FETCH_DEPS=ON): cmake/deps.cmake's URLs for the library's main and its dependencies, built
# from source. The other checks use the GHCR package and run only when pyatl changes, so this monthly run is also the
# one that builds pyatl against the library's current main without a pyatl commit.
on:
  schedule:
    - cron: '0 22 1 * *'
  workflow_dispatch:

name: fetch-check

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Install, fetching the library
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]" -v -Ccmake.define.PYATL_FETCH_DEPS=ON

      - name: Test
        run: python -m pytest
