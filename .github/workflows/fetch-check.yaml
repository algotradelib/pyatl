# The fetch route (PYATL_FETCH_DEPS=ON): the library's main and its dependencies built from source, weekly.
on:
  schedule:
    - cron: '0 22 * * 0'
  workflow_dispatch:

name: fetch-check

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Install, fetching the library
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]" -v -Ccmake.define.PYATL_FETCH_DEPS=ON

      - name: Test
        run: python -m pytest
