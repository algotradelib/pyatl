# Builds one cp312 abi3 wheel per OS and tests that same wheel on every supported Python.
# A CI check, not a distribution: a published wheel needs a chosen compatibility floor (manylinux, macOS minimum).
on:
  push:
    branches: [main, master, 'hotfix/*', 'release/*', develop]
    paths:
      - 'CMakeLists.txt'
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'requirements/**'
      - 'pyproject.toml'
      - 'cmake/**'
      - '.github/workflows/wheel-check.yaml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'CMakeLists.txt'
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'requirements/**'
      - 'pyproject.toml'
      - 'cmake/**'
      - '.github/workflows/wheel-check.yaml'
  workflow_dispatch:

name: wheel-check

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    name: build (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: algotradelib/.github/actions/setup-atl@main

      - name: OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "OPENSSL_ROOT_DIR=C:/Program Files/OpenSSL;C:/Program Files/OpenSSL/lib/VC/x64/MD" >> "$GITHUB_ENV"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist .

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  test:
    needs: wheel
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14']

    name: test (${{ matrix.os }}, ${{ matrix.python-version }})

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.os }}
          path: dist

      # A fresh venv with the wheel and the test extra; no library, Boost or OpenSSL on this runner's path.
      - name: Install the wheel
        shell: bash
        run: |
          python -m venv venv
          if [ "$RUNNER_OS" = Windows ]; then py=venv/Scripts/python; else py=venv/bin/python; fi
          wheel=$(ls dist/*.whl)
          "$py" -m pip install "${wheel}[test]"
          echo "PY=$py" >> "$GITHUB_ENV"

      - name: Test the wheel
        shell: bash
        run: |
          cp -r tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$PY" -m pytest tests
